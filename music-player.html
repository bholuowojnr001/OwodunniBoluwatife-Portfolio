<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Music Player</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: #edf2f7;
            text-align: center;
            padding: 40px 20px;
        }

        .player {
            max-width: 400px;
            margin: 40px auto;
            padding: 30px;
            background: #1c2335;
            border: 1px solid #30394f;
            border-radius: 20px;
        }

        h1 {
            color: #32d6b0;
        }

        p {
            color: #aeb9cb;
            line-height: 1.6;
        }

        audio {
            width: 100%;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="player">
        <h1>🎵 My Portfolio Music</h1>

        <p>Enjoy calm instrumental music while exploring my portfolio.</p>

        <audio controls loop autoplay>
            <source src="media/background-music.mp3.mp3" type="audio/mpeg">
            Your browser does not support audio playback.
        </audio>

        <p>You can keep this tab open while browsing the other portfolio pages.</p>
    </div>

</body>
</html>
